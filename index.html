<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casa mia in 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --calce: #efe9dd; --carta: rgba(244, 239, 229, 0.95); --salvia: #4d6152; --noce: #5a3b25; --ottone: #b08d57; --tortora: #8c7f70; --inchiostro: #2b241d;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--sans); background: #1b1917; -webkit-font-smoothing: antialiased; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
    #pannello {
      position: fixed; top: 16px; left: 16px; width: 262px; max-height: calc(100% - 32px); overflow: auto; z-index: 2;
      background: var(--carta); color: var(--inchiostro); border: 1px solid rgba(176,141,87,0.55);
      border-radius: 6px; padding: 18px 18px 14px; box-shadow: 0 10px 34px rgba(0,0,0,0.32); font-size: 13px;
      backdrop-filter: blur(6px); scrollbar-width: thin;
    }
    #pannello h1 { font-family: var(--serif); font-size: 27px; margin: 0; font-weight: 600; letter-spacing: 0.02em; color: var(--noce); line-height: 1; }
    #pannello .sub { font-family: var(--serif); font-size: 15px; color: var(--tortora); margin: 4px 0 6px; font-style: italic; }
    #pannello h2 { font-family: var(--sans); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--salvia); margin: 16px 0 7px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    #pannello h2::after { content: ''; flex: 1; height: 1px; background: rgba(176,141,87,0.45); }
    #pannello button {
      display: block; width: 100%; text-align: left; margin: 4px 0; padding: 7px 11px; cursor: pointer; font-family: var(--sans); font-size: 13px; letter-spacing: 0.01em;
      background: rgba(255,255,255,0.35); border: 1px solid rgba(90,59,37,0.22); border-radius: 4px; color: var(--inchiostro); transition: background .2s, border-color .2s, color .2s;
    }
    #pannello button:hover { background: rgba(77,97,82,0.10); border-color: rgba(77,97,82,0.45); }
    #pannello button.on { background: var(--salvia); color: var(--calce); border-color: var(--salvia); }
    #pannello .row { display: flex; gap: 6px; }
    #pannello .row button { flex: 1; text-align: center; }
    #pannello button.largo { width: 100%; margin-top: 6px; text-align: center; }
    #pannello .hint { font-size: 11.5px; color: var(--tortora); margin-top: 8px; line-height: 1.45; }
    .cursore { display: grid; grid-template-columns: 42px 1fr 76px; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--inchiostro); }
    .cursore output { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--noce); text-align: right; white-space: nowrap; }
    .cursore input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: rgba(90,59,37,0.3); outline: none; margin: 8px 0; }
    .cursore input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ottone); border: 2px solid var(--calce); box-shadow: 0 1px 4px rgba(0,0,0,0.35); cursor: pointer; }
    .cursore input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--ottone); border: 2px solid var(--calce); cursor: pointer; }
    #fps { position: fixed; right: 12px; bottom: 10px; color: rgba(239,233,221,0.6); font-size: 11px; font-family: ui-monospace, monospace; }
    /* ---- caricamento ---- */
    #caricamento {
      position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at 50% 40%, #2c2620 0%, #171411 70%); color: var(--calce); transition: opacity 1.1s ease; --avanzamento: 0.03;
    }
    #caricamento.fatto { opacity: 0; pointer-events: none; }
    #caricamento .c-titolo { font-family: var(--serif); font-size: clamp(44px, 8vw, 76px); font-weight: 500; letter-spacing: 0.04em; line-height: 1; }
    #caricamento .c-sub { font-family: var(--serif); font-style: italic; font-size: clamp(17px, 2.4vw, 22px); color: #c9b28a; margin-bottom: 26px; }
    #caricamento .c-barra { width: min(280px, 70vw); height: 1px; background: rgba(239,233,221,0.18); position: relative; overflow: hidden; }
    #caricamento .c-barra::after { content: ''; position: absolute; inset: 0; background: var(--ottone); transform-origin: left; transform: scaleX(var(--avanzamento)); transition: transform .5s ease; }
    #caricamento .c-stato { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(239,233,221,0.55); margin-top: 6px; min-height: 1em; }
    /* ---- avviso ---- */
    #avviso {
      position: fixed; left: 50%; bottom: 28px; z-index: 25; transform: translate(-50%, 20px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
      background: rgba(20,17,14,0.85); color: var(--calce); padding: 10px 18px; border-radius: 20px; font-size: 13px; letter-spacing: 0.02em; border: 1px solid rgba(176,141,87,0.6);
    }
    #avviso.vista { opacity: 1; transform: translate(-50%, 0); }
    /* ---- piantina quotata ---- */
    #piantina { position: fixed; inset: 0; z-index: 10; background: #fff; overflow: auto; display: none; color: #111; }
    body.piantina #piantina { display: block; }
    .pg-barra {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
      background: #fff; border-bottom: 1px solid #111; padding: 10px 18px calc(10px + env(safe-area-inset-top, 0px));
      font-family: Georgia, serif;
    }
    .pg-barra strong { font-size: 16px; letter-spacing: 0.06em; }
    .pg-nota { font-size: 12px; color: #555; flex: 1 1 260px; font-style: italic; }
    .pg-barra button {
      font-family: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer;
      background: #fff; color: #111; border: 1px solid #111; border-radius: 3px;
    }
    .pg-barra button:hover { background: #111; color: #fff; }
    .pg-foglio { padding: 18px; max-width: 1500px; margin: 0 auto; }
    .pg-foglio + .pg-foglio { border-top: 2px solid #111; }
    .pg-foglio svg { width: 100%; height: auto; display: block; }
    .pg-foglio h3 { font-family: Georgia, serif; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; margin: 28px 0 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
    .pg-tab { overflow-x: auto; }
    .pg-foglio table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13px; font-family: ui-monospace, monospace; }
    .pg-foglio th, .pg-foglio td { border: 1px solid #bbb; padding: 4px 7px; text-align: left; }
    .pg-foglio th { background: #f2f2f2; font-weight: normal; letter-spacing: 0.04em; }
    /* stili del disegno */
    .muroE, .muroI { fill: #141414; }
    .stanza { fill: #fff; }
    .esterno { fill: #fafafa; stroke: #141414; stroke-width: 2; stroke-dasharray: 18 10; vector-effect: non-scaling-stroke; }
    .vano { fill: #fff; stroke: #141414; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .vuoto { fill: #fff; }
    .vuotoL, .serr { stroke: #141414; stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; }
    .battente { stroke: #141414; stroke-width: 5; vector-effect: non-scaling-stroke; }
    .battente.tasca { stroke: #fff; stroke-width: 3; stroke-dasharray: 10 6; }
    .arco { fill: none; stroke: #141414; stroke-width: 2; stroke-dasharray: 12 8; vector-effect: non-scaling-stroke; }
    .quota { stroke: #141414; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
    .quotaTxt { font-family: ui-monospace, monospace; font-size: 26px; fill: #141414; }
    .nome { font-family: Georgia, serif; font-size: 30px; fill: #141414; letter-spacing: 2px; }
    .nomeS { font-family: Georgia, serif; font-size: 25px; fill: #444; letter-spacing: 2px; }
    .mis { font-family: ui-monospace, monospace; font-size: 24px; fill: #333; }
    .bollo { fill: #fff; stroke: #141414; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .bolloTxt { font-family: ui-monospace, monospace; font-size: 19px; fill: #141414; }
    .titolo { font-family: Georgia, serif; font-size: 62px; fill: #141414; letter-spacing: 8px; }
    @media print {
      #app, #pannello, #apri-pannello, #fps, #mirino { display: none !important; }
      #piantina { display: block !important; position: static; overflow: visible; }
      .pg-barra { display: none; }
    }
    #apri-pannello {
      position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 3; display: none;
      background: rgba(239,233,221,0.94); color: #2b241d; border: 1px solid var(--ottone); border-radius: 4px;
      padding: 8px 12px; font-family: inherit; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    @media (max-width: 700px), (max-height: 560px) {
      /* ---- piantina quotata ---- */

    @media print {
      #app, #pannello, #apri-pannello, #fps, #mirino { display: none !important; }
      #piantina { display: block !important; position: static; overflow: visible; }
      .pg-barra { display: none; }
    }
    #apri-pannello { display: block; }
      #pannello { display: none; width: min(250px, calc(100vw - 32px)); top: calc(52px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 68px - env(safe-area-inset-top, 0px)); }
      body.pannello-aperto #pannello { display: block; }
      #pannello button { padding: 9px 10px; font-size: 14px; }
    }
    body.touch .hint:not(.touch-hint):not(#nota-sole):not(#nota-tavolo):not(#nota-versione) { display: none; }
    .touch-hint { display: none; } body.touch .touch-hint { display: block; }
  </style>
</head>
<body>
  <div id="caricamento">
    <div class="c-titolo">Casa mia</div>
    <div class="c-sub">antico in chiave moderna</div>
    <div class="c-barra"></div>
    <div class="c-stato">Materiali e luce</div>
  </div>
  <div id="app"></div>
  <button id="apri-pannello" type="button">Menu</button>
  <div id="pannello">
    <h1>Casa mia</h1>
    <div class="sub">antico in chiave moderna</div>
    <h2>Piano</h2>
    <div class="row">
      <button id="btn-primo" class="on">Piano primo</button>
      <button id="btn-terra">Piano terra</button>
    </div>
    <div id="sez-allestimento">
    <h2>Versione</h2>
    <div class="row">
      <button id="btn-v1" class="on">Versione 1</button>
      <button id="btn-v2">Versione 2</button>
    </div>
    <button id="btn-porta" class="largo" style="display:none">Chiudi la porta</button>
    <button id="btn-veranda" class="largo" style="display:none">Apri la veranda</button>
    <div class="hint" id="nota-versione"></div>
    <h2>Tavolo</h2>
    <div class="row">
      <button id="btn-t-chiuso">Chiuso</button>
      <button id="btn-t-aperto" class="on">Aperto</button>
    </div>
    <div class="hint" id="nota-tavolo"></div>
    </div>
    <h2>Sole</h2>
    <label class="cursore"><span>Ora</span><input id="sl-ora" type="range" min="5" max="22" step="0.25" /><output id="out-ora"></output></label>
    <label class="cursore"><span>Giorno</span><input id="sl-mese" type="range" min="0" max="11" step="1" /><output id="out-mese"></output></label>
    <div class="hint" id="nota-sole"></div>
    <h2>Scena</h2>
    <button id="btn-tetto" class="on">Tetto e soffitti</button>
    <button id="btn-pareti" class="on">Pareti intere</button>
    <button id="btn-giorno" class="on">Luce del giorno</button>
    <button id="btn-qualita" class="on">Qualità alta</button>
    <h2>Strumenti</h2>
    <button id="btn-piantina">Piantina quotata</button>
    <button id="btn-link">Copia il link di questa vista</button>
    <div class="hint">Trascina per ruotare, rotella per lo zoom, tasto destro per spostarti.</div>
    <div class="hint touch-hint">Un dito per ruotare, due dita per zoom e spostamento.</div>
  </div>
  <div id="avviso"></div>
  <div id="fps"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
